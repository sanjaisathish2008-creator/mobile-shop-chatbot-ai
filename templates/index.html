<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MobileShop AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #07111f;
            --panel: rgba(12, 25, 43, 0.78);
            --panel-2: rgba(18, 35, 58, 0.82);
            --border: rgba(255, 255, 255, 0.10);
            --text: #eef6ff;
            --muted: #9db0c6;
            --accent: #65e8ff;
            --accent-2: #8b7cff;
            --user: #284c72;
        }

        body {
            min-height: 100vh;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 15%, rgba(101, 232, 255, 0.13), transparent 28%),
                radial-gradient(circle at 85% 80%, rgba(139, 124, 255, 0.16), transparent 30%),
                var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 22px;
        }

        .app {
            width: min(980px, 100%);
            height: min(820px, 94vh);
            min-height: 620px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 28px;
            background: var(--panel);
            backdrop-filter: blur(22px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.38);
        }

        header {
            padding: 24px 26px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 48px;
            height: 48px;
            border-radius: 15px;
            display: grid;
            place-items: center;
            font-size: 23px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #06101c;
            box-shadow: 0 8px 28px rgba(101, 232, 255, 0.18);
        }

        .brand h1 {
            font-size: 20px;
            letter-spacing: -0.3px;
        }

        .brand p {
            margin-top: 3px;
            color: var(--muted);
            font-size: 13px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #b8c9dc;
            font-size: 12px;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 999px;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #63e6be;
            box-shadow: 0 0 12px #63e6be;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .welcome {
            max-width: 620px;
            margin: auto;
            text-align: center;
            color: var(--muted);
        }

        .welcome .phone {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .welcome h2 {
            color: var(--text);
            font-size: 27px;
            margin-bottom: 8px;
        }

        .welcome p {
            line-height: 1.65;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 9px;
            margin-top: 20px;
        }

        .chip {
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            color: #c9d8e8;
            border-radius: 999px;
            padding: 9px 13px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .chip:hover {
            border-color: rgba(101, 232, 255, 0.4);
            transform: translateY(-1px);
        }

        .message {
            max-width: 76%;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .message.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message.bot {
            align-self: flex-start;
        }

        .bubble {
            padding: 13px 16px;
            border-radius: 18px;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .user .bubble {
            background: linear-gradient(135deg, #285477, #213f61);
            border-bottom-right-radius: 6px;
        }

        .bot .bubble {
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-bottom-left-radius: 6px;
        }

        .time {
            color: #71869e;
            font-size: 10px;
            padding: 0 5px;
        }

        .composer {
            padding: 18px 22px 22px;
            border-top: 1px solid var(--border);
            background: rgba(4, 12, 23, 0.28);
        }

        form {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 19px;
            background: rgba(255, 255, 255, 0.045);
        }

        textarea {
            flex: 1;
            resize: none;
            min-height: 44px;
            max-height: 130px;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--text);
            padding: 11px 10px;
            font: inherit;
        }

        textarea::placeholder {
            color: #71869e;
        }

        button.send {
            width: 45px;
            height: 45px;
            flex: 0 0 45px;
            border: 0;
            border-radius: 14px;
            cursor: pointer;
            color: #07111f;
            font-size: 19px;
            background: linear-gradient(135deg, var(--accent), #a7f3ff);
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        button.send:hover {
            transform: scale(1.04);
        }

        button.send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .typing {
            display: inline-flex;
            gap: 4px;
            padding: 4px 2px;
        }

        .typing span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #91a8be;
            animation: bounce 1s infinite ease-in-out;
        }

        .typing span:nth-child(2) { animation-delay: .15s; }
        .typing span:nth-child(3) { animation-delay: .3s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: .45; }
            40% { transform: translateY(-5px); opacity: 1; }
        }

        @media (max-width: 650px) {
            body { padding: 0; }
            .app {
                height: 100vh;
                min-height: 100vh;
                border-radius: 0;
            }
            header { padding: 18px; }
            .status { display: none; }
            .messages { padding: 20px 16px; }
            .composer { padding: 12px; }
            .message { max-width: 88%; }
            .welcome h2 { font-size: 23px; }
        }
    </style>
</head>
<body>
    <main class="app">
        <header>
            <div class="brand">
                <div class="logo">📱</div>
                <div>
                    <h1>MobileShop AI</h1>
                    <p>Smartphone & mobile-shop assistant</p>
                </div>
            </div>
            <div class="status">
                <span class="dot"></span>
                Online
            </div>
        </header>

        <section class="messages" id="messages">
            <div class="welcome" id="welcome">
                <div class="phone">📲</div>
                <h2>Find the right phone.</h2>
                <p>
                    Ask me about smartphones, specifications, comparisons,
                    accessories, setup, troubleshooting, or buying guidance.
                </p>
                <div class="chips">
                    <button class="chip" data-message="Compare iPhone and Samsung phones">Compare phones</button>
                    <button class="chip" data-message="What should I look for in a gaming phone?">Gaming phones</button>
                    <button class="chip" data-message="Which specifications matter most for a phone camera?">Camera specs</button>
                    <button class="chip" data-message="What accessories are useful for a new phone?">Accessories</button>
                </div>
            </div>
        </section>

        <div class="composer">
            <form id="chatForm">
                <textarea id="messageInput" rows="1" placeholder="Ask about a mobile phone..." autocomplete="off"></textarea>
                <button class="send" id="sendButton" type="submit" aria-label="Send">➤</button>
            </form>
        </div>
    </main>

    <script>
        const form = document.getElementById("chatForm");
        const input = document.getElementById("messageInput");
        const messages = document.getElementById("messages");
        const sendButton = document.getElementById("sendButton");
        const welcome = document.getElementById("welcome");

        function timeNow() {
            return new Date().toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit"
            });
        }

        function addMessage(text, role) {
            if (welcome) welcome.remove();

            const wrapper = document.createElement("div");
            wrapper.className = `message ${role}`;

            const bubble = document.createElement("div");
            bubble.className = "bubble";
            bubble.textContent = text;

            const time = document.createElement("div");
            time.className = "time";
            time.textContent = timeNow();

            wrapper.appendChild(bubble);
            wrapper.appendChild(time);
            messages.appendChild(wrapper);
            messages.scrollTop = messages.scrollHeight;
        }

        function addTyping() {
            const wrapper = document.createElement("div");
            wrapper.className = "message bot";
            wrapper.id = "typing";

            const bubble = document.createElement("div");
            bubble.className = "bubble";

            const dots = document.createElement("div");
            dots.className = "typing";
            dots.innerHTML = "<span></span><span></span><span></span>";

            bubble.appendChild(dots);
            wrapper.appendChild(bubble);
            messages.appendChild(wrapper);
            messages.scrollTop = messages.scrollHeight;
        }

        function removeTyping() {
            document.getElementById("typing")?.remove();
        }

        async function sendMessage(text) {
            const message = text.trim();
            if (!message || sendButton.disabled) return;

            addMessage(message, "user");
            input.value = "";
            input.style.height = "auto";
            sendButton.disabled = true;
            addTyping();

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();
                removeTyping();

                if (!response.ok) {
                    addMessage(data.error || "Something went wrong.", "bot");
                } else {
                    addMessage(data.answer || "I couldn't generate a response.", "bot");
                }
            } catch (error) {
                removeTyping();
                addMessage("Unable to connect to the chatbot server.", "bot");
            } finally {
                sendButton.disabled = false;
                input.focus();
            }
        }

        form.addEventListener("submit", (event) => {
            event.preventDefault();
            sendMessage(input.value);
        });

        input.addEventListener("input", () => {
            input.style.height = "auto";
            input.style.height = Math.min(input.scrollHeight, 130) + "px";
        });

        input.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                form.requestSubmit();
            }
        });

        document.querySelectorAll(".chip").forEach((chip) => {
            chip.addEventListener("click", () => {
                sendMessage(chip.dataset.message);
            });
        });
    </script>
</body>
</html>
